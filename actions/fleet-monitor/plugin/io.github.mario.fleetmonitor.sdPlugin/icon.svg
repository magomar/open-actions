<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: slate-800 (#1e293b) to slate-950 (#020617) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Helm Gradient with userSpaceOnUse so horizontal and vertical lines render reliably -->
    <linearGradient id="helmGrad" x1="100" y1="100" x2="412" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Ship Wheel (Centered at 256, 256) -->
  <g id="wheelGroup">
    <!-- Outer Wheel Rim -->
    <circle cx="256" cy="256" r="105" stroke="url(#helmGrad)" stroke-width="16" filter="url(#outerGlow)" fill="none" />

    <!-- Inner Compass Accent Ring -->
    <circle cx="256" cy="256" r="68" stroke="#38bdf8" stroke-width="5.5" stroke-dasharray="7 11" opacity="0.65" fill="none" />

    <!-- Center Hub -->
    <circle cx="256" cy="256" r="34" fill="#0f172a" stroke="url(#helmGrad)" stroke-width="11" />
    <circle cx="256" cy="256" r="13" fill="#38bdf8" />

    <!-- 8 Spokes & Handles -->
    <!-- Vertical (0° & 180°) -->
    <line x1="256" y1="114" x2="256" y2="222" stroke="url(#helmGrad)" stroke-width="13" stroke-linecap="round" />
    <line x1="256" y1="290" x2="256" y2="398" stroke="url(#helmGrad)" stroke-width="13" stroke-linecap="round" />

    <!-- Horizontal (90° & 270°) -->
    <line x1="114" y1="256" x2="222" y2="256" stroke="url(#helmGrad)" stroke-width="13" stroke-linecap="round" />
    <line x1="290" y1="256" x2="398" y2="256" stroke="url(#helmGrad)" stroke-width="13" stroke-linecap="round" />

    <!-- Diagonal 45° -->
    <line x1="155.6" y1="155.6" x2="232" y2="232" stroke="url(#helmGrad)" stroke-width="13" stroke-linecap="round" />
    <line x1="280" y1="280" x2="356.4" y2="356.4" stroke="url(#helmGrad)" stroke-width="13" stroke-linecap="round" />

    <!-- Diagonal 135° -->
    <line x1="356.4" y1="155.6" x2="280" y2="232" stroke="url(#helmGrad)" stroke-width="13" stroke-linecap="round" />
    <line x1="232" y1="280" x2="155.6" y2="356.4" stroke="url(#helmGrad)" stroke-width="13" stroke-linecap="round" />
  </g>
</svg>
