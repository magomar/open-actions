[package]
name = "pomodoro-timer"
version = "0.1.0"
edition = "2024"

[dependencies]
openaction = "2.7.0"
rodio = { version = "0.20", default-features = false, features = ["wav", "symphonia-wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
